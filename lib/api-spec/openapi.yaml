openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: products
    description: Product and stock operations
  - name: dashboard
    description: Inventory summaries and activity
  - name: orders
    description: Purchase orders and stock replenishment
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /products:
    get:
      operationId: listProducts
      tags: [products]
      summary: List products
      parameters:
        - in: query
          name: search
          schema: { type: string }
        - in: query
          name: status
          schema:
            type: string
            enum: [all, normal, low, out]
        - in: query
          name: category
          schema: { type: string }
      responses:
        "200":
          description: Product list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"
    post:
      operationId: createProduct
      tags: [products]
      summary: Create a product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductInput"
      responses:
        "201":
          description: Created product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
  /products/{id}:
    patch:
      operationId: updateProduct
      tags: [products]
      summary: Update a product
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: number, format: int32 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductUpdate"
      responses:
        "200":
          description: Updated product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "404":
          description: Product not found
    delete:
      operationId: deleteProduct
      tags: [products]
      summary: Delete a product
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: number, format: int32 }
      responses:
        "204":
          description: Deleted
        "404":
          description: Product not found
  /products/{id}/stock:
    post:
      operationId: createStockMovement
      tags: [products]
      summary: Add or remove stock
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: number, format: int32 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StockMovementInput"
      responses:
        "200":
          description: Product with updated stock
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "400":
          description: Invalid movement
        "404":
          description: Product not found
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get inventory summary
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
  /activity:
    get:
      operationId: listActivity
      tags: [dashboard]
      summary: List recent stock activity
      responses:
        "200":
          description: Recent activity
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Activity"
  /orders:
    get:
      operationId: listOrders
      tags: [orders]
      summary: List finalized purchase orders
      responses:
        "200":
          description: Purchase order list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"
    post:
      operationId: createOrder
      tags: [orders]
      summary: Finalize a stock entry or exit order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderInput"
      responses:
        "201":
          description: Finalized purchase order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          description: Invalid order
  /auth/bootstrap-status:
    get:
      operationId: getBootstrapStatus
      tags: [users]
      responses:
        "200":
          description: First-administrator setup status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BootstrapStatus"
  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [users]
      responses:
        "200":
          description: Current signed-in user and role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppUser"
  /users:
    get:
      operationId: listUsers
      tags: [users]
      responses:
        "200":
          description: Users and pending invitations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ManagedUser"
    post:
      operationId: inviteUser
      tags: [users]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserInvitationInput"
      responses:
        "201":
          description: User invitation sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagedUser"
  /users/{id}:
    delete:
      operationId: deleteUser
      tags: [users]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: number, format: int32 }
      responses:
        "204": { description: User or invitation removed }
        "400": { description: Current or last administrator cannot be removed }
        "404": { description: User not found }
  /warehouses:
    get:
      operationId: listWarehouses
      tags: [warehouses]
      responses:
        "200":
          description: Warehouses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Warehouse"
    post:
      operationId: createWarehouse
      tags: [warehouses]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WarehouseInput"
      responses:
        "201":
          description: Warehouse created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Warehouse"
  /warehouses/{id}:
    patch:
      operationId: updateWarehouse
      tags: [warehouses]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: number, format: int32 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WarehouseUpdate"
      responses:
        "200":
          description: Warehouse updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Warehouse"
    delete:
      operationId: deleteWarehouse
      tags: [warehouses]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: number, format: int32 }
      responses:
        "204": { description: Empty warehouse deleted }
        "409": { description: Warehouse has stock }
  /locations:
    get:
      operationId: listLocations
      tags: [warehouses]
      parameters:
        - in: query
          name: warehouseId
          schema: { type: number, format: int32 }
      responses:
        "200":
          description: Physical storage locations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StorageLocation"
    post:
      operationId: createLocation
      tags: [warehouses]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StorageLocationInput"
      responses:
        "201":
          description: Location created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageLocation"
  /locations/{id}:
    patch:
      operationId: updateLocation
      tags: [warehouses]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: number, format: int32 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StorageLocationUpdate"
      responses:
        "200":
          description: Location updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageLocation"
    delete:
      operationId: deleteLocation
      tags: [warehouses]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: number, format: int32 }
      responses:
        "204": { description: Empty location deleted }
        "409": { description: Location has stock }
  /inventory:
    get:
      operationId: listInventory
      tags: [warehouses]
      parameters:
        - in: query
          name: warehouseId
          schema: { type: number, format: int32 }
        - in: query
          name: productId
          schema: { type: number, format: int32 }
      responses:
        "200":
          description: Stock balance per product and physical location
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InventoryBalance"
  /customers:
    get:
      operationId: listCustomers
      tags: [customers]
      responses:
        "200":
          description: Customers with purchase totals
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Customer"
    post:
      operationId: createCustomer
      tags: [customers]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerInput"
      responses:
        "201":
          description: Customer created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
  /customers/{id}:
    get:
      operationId: getCustomer
      tags: [customers]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: number, format: int32 }
      responses:
        "200":
          description: Customer profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
    patch:
      operationId: updateCustomer
      tags: [customers]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: number, format: int32 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerUpdate"
      responses:
        "200":
          description: Customer updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
    delete:
      operationId: deleteCustomer
      tags: [customers]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: number, format: int32 }
      responses:
        "204": { description: "Customer deleted, preserving sales history" }
  /customers/{id}/purchase-history:
    get:
      operationId: getCustomerPurchaseHistory
      tags: [customers]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: number, format: int32 }
      responses:
        "200":
          description: Customer sales history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"
  /suppliers:
    get:
      operationId: listSuppliers
      tags: [suppliers]
      responses:
        "200":
          description: Suppliers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Supplier"
    post:
      operationId: createSupplier
      tags: [suppliers]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SupplierInput"
      responses:
        "201":
          description: Supplier created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Supplier"
  /suppliers/{id}:
    patch:
      operationId: updateSupplier
      tags: [suppliers]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: number, format: int32 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SupplierUpdate"
      responses:
        "200":
          description: Supplier updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Supplier"
    delete:
      operationId: deleteSupplier
      tags: [suppliers]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: number, format: int32 }
      responses:
        "204": { description: "Supplier deleted, preserving purchase history" }
  /reports/stock:
    get:
      operationId: getStockReport
      tags: [reports]
      parameters:
        - in: query
          name: warehouseId
          schema: { type: number, format: int32 }
      responses:
        "200":
          description: Stock level and valuation by location
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StockReportRow"
  /reports/movements:
    get:
      operationId: getMovementReport
      tags: [reports]
      parameters:
        - in: query
          name: from
          schema: { type: string, format: date }
        - in: query
          name: to
          schema: { type: string, format: date }
        - in: query
          name: warehouseId
          schema: { type: number, format: int32 }
      responses:
        "200":
          description: Entries, exits, and adjustments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MovementReportRow"
  /reports/sales:
    get:
      operationId: getSalesReport
      tags: [reports]
      parameters:
        - in: query
          name: from
          schema: { type: string, format: date }
        - in: query
          name: to
          schema: { type: string, format: date }
      responses:
        "200":
          description: Sales volume, products, and revenue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SalesReport"
  /reports/purchases:
    get:
      operationId: getPurchaseReport
      tags: [reports]
      parameters:
        - in: query
          name: from
          schema: { type: string, format: date }
        - in: query
          name: to
          schema: { type: string, format: date }
      responses:
        "200":
          description: Purchases by supplier, value, and product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PurchaseReport"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Product:
      type: object
      required: [id, sku, name, category, brand, accent, unitPrice, stock, minStock, maxStock, status, updatedAt]
      properties:
        id: { type: number, format: int32 }
        sku: { type: string }
        name: { type: string }
        category: { type: string }
        brand: { type: string }
        accent:
          type: string
          enum: [pink, orange]
        unitPrice: { type: number }
        stock: { type: number, format: int64 }
        minStock: { type: number, format: int64 }
        maxStock: { type: number, format: int64 }
        status:
          type: string
          enum: [normal, low, out]
        updatedAt: { type: string, format: date-time }
    ProductInput:
      type: object
      required: [sku, name, category, brand, accent, unitPrice, stock, minStock]
      properties:
        sku: { type: string, minLength: 1 }
        name: { type: string, minLength: 1 }
        category: { type: string, minLength: 1 }
        brand: { type: string, minLength: 1 }
        accent:
          type: string
          enum: [pink, orange]
        unitPrice: { type: number, minimum: 0 }
        stock: { type: number, format: int64, minimum: 0 }
        minStock: { type: number, format: int64, minimum: 0 }
        maxStock: { type: number, format: int64, minimum: 0 }
        locationId: { type: number, format: int32 }
    ProductUpdate:
      type: object
      properties:
        sku: { type: string, minLength: 1 }
        name: { type: string, minLength: 1 }
        category: { type: string, minLength: 1 }
        brand: { type: string, minLength: 1 }
        accent:
          type: string
          enum: [pink, orange]
        unitPrice: { type: number, minimum: 0 }
        minStock: { type: number, format: int64, minimum: 0 }
        maxStock: { type: number, format: int64, minimum: 0 }
    StockMovementInput:
      type: object
      required: [type, quantity]
      properties:
        type:
          type: string
          enum: [in, out, adjustment]
        quantity: { type: number, format: int64 }
        locationId: { type: number, format: int32 }
        note: { type: string }
    DashboardSummary:
      type: object
      required: [totalProducts, totalUnits, lowStock, outOfStock, inventoryValue]
      properties:
        totalProducts: { type: number, format: int32 }
        totalUnits: { type: number, format: int64 }
        lowStock: { type: number, format: int32 }
        outOfStock: { type: number, format: int32 }
        inventoryValue: { type: number }
    Activity:
      type: object
      required: [id, productName, type, quantity, createdAt]
      properties:
        id: { type: number, format: int32 }
        productName: { type: string }
        type:
          type: string
          enum: [in, out, adjustment]
        quantity: { type: number, format: int64 }
        note: { type: ["string", "null"] }
        warehouseName: { type: ["string", "null"] }
        locationName: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }
    OrderItemInput:
      type: object
      required: [productId, quantity]
      properties:
        productId: { type: number, format: int32 }
        quantity: { type: number, format: int64, minimum: 1 }
        unitPrice: { type: number, minimum: 0 }
    OrderInput:
      type: object
      required: [type, items]
      properties:
        type:
          type: string
          enum: [in, out]
        customerName: { type: string, minLength: 1 }
        customerPhone: { type: string, minLength: 1 }
        customerId: { type: number, format: int32 }
        supplierId: { type: number, format: int32 }
        locationId: { type: number, format: int32 }
        paymentMethod:
          type: string
          enum: [pix, cash, debit_card, credit_card, transfer, other]
        installments: { type: number, format: int32, minimum: 1, maximum: 12 }
        items:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/OrderItemInput"
    OrderItem:
      type: object
      required: [id, productId, productName, sku, quantity, unitPrice, totalValue]
      properties:
        id: { type: number, format: int32 }
        productId: { type: number, format: int32 }
        productName: { type: string }
        sku: { type: string }
        quantity: { type: number, format: int64 }
        unitPrice: { type: number }
        totalValue: { type: number }
    Order:
      type: object
      required: [id, type, status, customerName, customerPhone, paymentMethod, installments, totalItems, totalValue, items, createdAt, customerId, supplierId, supplierName, locationId, locationName]
      properties:
        id: { type: number, format: int32 }
        type:
          type: string
          enum: [in, out]
        status:
          type: string
          enum: [finalized]
        customerName: { type: ["string", "null"] }
        customerPhone: { type: ["string", "null"] }
        customerId: { type: ["number", "null"], format: int32 }
        supplierId: { type: ["number", "null"], format: int32 }
        supplierName: { type: ["string", "null"] }
        locationId: { type: ["number", "null"], format: int32 }
        locationName: { type: ["string", "null"] }
        paymentMethod: { type: ["string", "null"], enum: [pix, cash, debit_card, credit_card, transfer, other, null] }
        installments: { type: number, format: int32 }
        totalItems: { type: number, format: int64 }
        totalValue: { type: number }
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderItem"
        createdAt: { type: string, format: date-time }
    UserRole:
      type: string
      enum: [administrator, manager, employee, consultation]
    BootstrapStatus:
      type: object
      required: [needsAdministrator]
      properties:
        needsAdministrator: { type: boolean }
    AppUser:
      type: object
      required: [id, clerkUserId, email, name, role, createdAt]
      properties:
        id: { type: number, format: int32 }
        clerkUserId: { type: string }
        email: { type: string }
        name: { type: string }
        role: { $ref: "#/components/schemas/UserRole" }
        createdAt: { type: string, format: date-time }
    ManagedUser:
      type: object
      required: [id, email, name, role, status, createdAt]
      properties:
        id: { type: number, format: int32 }
        email: { type: string }
        name: { type: string }
        role: { $ref: "#/components/schemas/UserRole" }
        status: { type: string, enum: [active, invited] }
        createdAt: { type: string, format: date-time }
    UserInvitationInput:
      type: object
      required: [email, name, role]
      properties:
        email: { type: string, minLength: 3 }
        name: { type: string, minLength: 1 }
        role: { $ref: "#/components/schemas/UserRole" }
    Warehouse:
      type: object
      required: [id, name, code, address, active, createdAt]
      properties:
        id: { type: number, format: int32 }
        name: { type: string }
        code: { type: string }
        address: { type: ["string", "null"] }
        active: { type: boolean }
        createdAt: { type: string, format: date-time }
    WarehouseInput:
      type: object
      required: [name, code]
      properties:
        name: { type: string, minLength: 1 }
        code: { type: string, minLength: 1 }
        address: { type: string }
        active: { type: boolean }
    WarehouseUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        code: { type: string, minLength: 1 }
        address: { type: ["string", "null"] }
        active: { type: boolean }
    StorageLocation:
      type: object
      required: [id, warehouseId, warehouseName, name, code, description, createdAt]
      properties:
        id: { type: number, format: int32 }
        warehouseId: { type: number, format: int32 }
        warehouseName: { type: string }
        name: { type: string }
        code: { type: string }
        description: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }
    StorageLocationInput:
      type: object
      required: [warehouseId, name, code]
      properties:
        warehouseId: { type: number, format: int32 }
        name: { type: string, minLength: 1 }
        code: { type: string, minLength: 1 }
        description: { type: string }
    StorageLocationUpdate:
      type: object
      properties:
        warehouseId: { type: number, format: int32 }
        name: { type: string, minLength: 1 }
        code: { type: string, minLength: 1 }
        description: { type: ["string", "null"] }
    InventoryBalance:
      type: object
      required: [id, productId, productName, sku, unitPrice, warehouseId, warehouseName, locationId, locationName, quantity, minStock, maxStock, inventoryValue]
      properties:
        id: { type: number, format: int32 }
        productId: { type: number, format: int32 }
        productName: { type: string }
        sku: { type: string }
        unitPrice: { type: number }
        warehouseId: { type: number, format: int32 }
        warehouseName: { type: string }
        locationId: { type: number, format: int32 }
        locationName: { type: string }
        quantity: { type: number, format: int64 }
        minStock: { type: number, format: int64 }
        maxStock: { type: number, format: int64 }
        inventoryValue: { type: number }
    Customer:
      type: object
      required: [id, name, document, phone, email, address, createdAt, purchaseCount, totalSpent]
      properties:
        id: { type: number, format: int32 }
        name: { type: string }
        document: { type: ["string", "null"] }
        phone: { type: string }
        email: { type: ["string", "null"] }
        address: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }
        purchaseCount: { type: number, format: int32 }
        totalSpent: { type: number }
    CustomerInput:
      type: object
      required: [name, phone]
      properties:
        name: { type: string, minLength: 1 }
        document: { type: string }
